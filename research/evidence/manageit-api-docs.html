<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>ManageIt Core — API Reference</title>
    <link rel="icon" href="https://api.manageit.dev/favicon.ico">
    <link rel="stylesheet" href="https://api.manageit.dev/vendor/swagger-ui/swagger-ui.css">
    <style>
        body { margin: 0; background: #fafafa; }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="https://api.manageit.dev/vendor/swagger-ui/swagger-ui-bundle.js"></script>
    <script src="https://api.manageit.dev/vendor/swagger-ui/swagger-ui-standalone-preset.js"></script>
    <script>
        window.addEventListener('load', function () {
            window.ui = SwaggerUIBundle({
                url: 'https://api.manageit.dev/docs/openapi.yaml',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset,
                ],
                layout: 'StandaloneLayout',
            });
        });
    </script>
</body>
</html>
